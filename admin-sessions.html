<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Session Moderation - HIVE Admin</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="admin-theme.css"/>
</head>
<body class="admin-body">

<div class="admin-layout">
  <!-- Sidebar -->
  <aside class="admin-sidebar" id="admin-sidebar">
    <div class="admin-sidebar-header">
      <span class="logo-text">HIVE ADMIN</span>
    </div>
    <nav class="admin-sidebar-nav">
      <div class="admin-nav-group">
        <div class="admin-nav-label">General</div>
        <a href="admin.html" class="admin-nav-item">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 12L12 3l9 9"/><path d="M5 10v10h4v-6h6v6h4V10"/></svg>
          Overview
        </a>
      </div>
      <div class="admin-nav-group">
        <div class="admin-nav-label">Management</div>
        <a href="admin-users.html" class="admin-nav-item">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
          Users
        </a>
        <a href="admin-sessions.html" class="admin-nav-item active">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="2" y="5" width="20" height="14" rx="2"/><polyline points="10 9 15 12 10 15"/></svg>
          Sessions
        </a>
      </div>
      <div class="admin-nav-group">
        <div class="admin-nav-label">Account</div>
        <a href="dashboard.html" class="admin-nav-item">Back to HIVE</a>
        <button type="button" class="admin-nav-item admin-nav-button" onclick="handleSignOut()">Logout</button>
      </div>
    </nav>
    <div class="admin-sidebar-footer">
      <div class="admin-user-card">
        <div class="admin-user-avatar">AD</div>
        <div class="admin-user-info">
          <span class="admin-user-name">System Admin</span>
          <span class="admin-user-role">Superuser</span>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="admin-main">
    <header class="admin-topbar">
      <div class="admin-topbar-title">
        <h1>Session Moderation</h1>
      </div>
      <div class="admin-topbar-actions">
        <button class="admin-btn-icon" title="Refresh data" onclick="loadAdminSessions()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 11-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
        </button>
      </div>
    </header>

    <div class="admin-content-scroll">
      
      <div class="admin-panel">
        <div class="admin-panel-header">
          <span class="admin-panel-title">All Sessions</span>
        </div>
        
        <div class="admin-table-container">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Session ID</th>
                <th>Topic</th>
                <th>Duration</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="admin-sessions-tbody">
              <!-- Data populated by app.js -->
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </main>
</div>

<!-- Toast for alerts -->
<div id="toast" class="toast">
  <div class="toast-icon"></div>
  <div class="toast-text">
    <strong></strong>
    <p></p>
  </div>
</div>

<script type="module" src="/app.js"></script>
</body>
</html>
