<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HIVE – Messages</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body, html { height: 100dvh; margin: 0; overflow: hidden; }
        
        .app-layout {
            height: 100dvh;
            min-height: 0;
            overflow: hidden;
            padding: 0 !important;
        }

        .main-content {
            height: 100dvh;
            min-height: 0;
            padding: 0 !important;
            display: flex !important;
            flex-direction: row !important;
            box-sizing: border-box;
        }
        
        .navbar {
            flex-shrink: 0;
        }

        .chat-container {
            display: flex;
            flex: 1;
            min-height: 0;
            background: var(--bg);
        }
        
        .conv-sidebar {
            width: 350px;
            border-right: 1px solid rgba(255,255,255,0.08);
            display: flex;
            flex-direction: column;
            background: var(--surface);
        }
        
        .sidebar-header {
            padding: 24px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .sidebar-header h2 {
            margin: 0;
            font-size: 20px;
        }
        
        .conv-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        
        .conv-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 24px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            transition: background 0.2s;
            text-decoration: none;
            color: inherit;
        }
        .conv-item:hover {
            background: rgba(255,255,255,0.02);
        }
        .conv-item.active {
            background: rgba(168, 85, 247, 0.1);
            border-right: 3px solid #a855f7;
        }
        
        .conv-avatar {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: linear-gradient(135deg, #c084fc, #ec4899);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
            flex-shrink: 0;
        }
        
        .conv-details {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        
        .conv-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }
        .conv-name {
            font-weight: 600;
            font-size: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .conv-time {
            font-size: 11px;
            color: var(--muted);
        }
        .conv-preview {
            font-size: 13px;
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .conv-preview.unread {
            color: #fff;
            font-weight: 600;
        }
        
        .unread-badge {
            background: #ec4899;
            color: #fff;
            font-size: 11px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 10px;
            margin-left: 8px;
        }
        
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 0;
        }
        
        .chat-empty {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--muted);
            font-size: 16px;
        }
        
        .chat-header {
            padding: 20px 24px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            display: flex;
            align-items: center;
            gap: 16px;
            background: var(--surface);
            flex-shrink: 0;
        }
        .chat-header-info h3 { margin: 0; font-size: 18px; }
        .chat-header-info p { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
        .btn-back {
            display: none;
            background: none;
            border: none;
            color: #a5b4fc;
            font-size: 15px;
            cursor: pointer;
            padding: 8px 12px;
            margin-left: -12px;
        }
        
        .messages-pane {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: #101015;
            min-height: 0;
        }
        
        .message {
            max-width: 70%;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .message.received {
            align-self: flex-start;
        }
        .message.sent {
            align-self: flex-end;
        }
        
        .msg-bubble {
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
            overflow-wrap: break-word;
        }
        .message.received .msg-bubble {
            background: rgba(255,255,255,0.1);
            border-bottom-left-radius: 4px;
        }
        .message.sent .msg-bubble {
            background: linear-gradient(135deg, #a855f7, #c026d3);
            border-bottom-right-radius: 4px;
        }
        
        .msg-meta {
            font-size: 11px;
            color: var(--muted);
            align-self: flex-end;
        }
        .message.received .msg-meta {
            align-self: flex-start;
        }
        
        .chat-composer {
            padding: 20px 90px 20px 24px;
            background: var(--surface);
            border-top: 1px solid rgba(255,255,255,0.08);
            display: flex;
            gap: 12px;
            flex-shrink: 0;
        }
        
        .chat-input {
            flex: 1;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 12px 20px;
            color: #fff;
            font-family: inherit;
            font-size: 14px;
            resize: none;
            outline: none;
        }
        .chat-input:focus {
            border-color: rgba(168, 85, 247, 0.5);
        }
        
        .btn-send {
            background: linear-gradient(135deg, #a855f7, #c026d3);
            border: none;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #fff;
            flex-shrink: 0;
            transition: transform 0.2s;
        }
        .btn-send:hover {
            transform: scale(1.05);
        }
        
        @media (max-width: 768px) {
            .notification-center {
                bottom: 100px !important;
                right: 16px !important;
            }
            .chat-composer {
                padding-right: 24px;
            }
            .chat-container {
                position: relative;
            }
            .conv-sidebar {
                width: 100%;
                border-right: none;
                display: flex;
            }
            .chat-area {
                position: absolute;
                top: 0; left: 0; right: 0; bottom: 0;
                background: #101015;
                z-index: 10;
                display: none;
            }
            .chat-area.active {
                display: flex;
            }
            .conv-sidebar.hidden {
                display: none;
            }
            .btn-back {
                display: block;
            }
        }
    </style>
</head>
<body>
    

    
<div class="bg-grid"></div>

<script type="module" src="/app.js"></script>

<script>
        let socket;
        let currentUser;
        let conversations = [];
        let activeConnId = null;
        
        const urlParams = new URLSearchParams(window.location.search);
        const initialConn = urlParams.get('conn');

        async function init() {
            const token = localStorage.getItem('token');
            if(!token) return window.location.href = 'index.html';
            
            // Get current user profile for ID check
            try {
                const res = await fetch('/api/users/me', { headers: { 'Authorization': `Bearer ${token}` } });
                const data = await res.json();
                currentUser = data;
            } catch(e) { console.error(e); }

            socket = io({ auth: { token } });
            
            socket.on('connect', () => console.log('Socket connected'));
            socket.on('message-received', handleNewMessage);
            socket.on('message-read', handleMessageRead);
            socket.on('error', (err) => console.error('Socket Error:', err));

        const u = JSON.parse(localStorage.getItem('hiveUser') || '{}');
        if(u.name) {
            document.getElementById('sidebar-name').innerText = u.name;
            document.getElementById('sidebar-avatar').innerText = u.name.charAt(0).toUpperCase();
        }

            
            await loadConversations();
            
            if (initialConn) {
                openChat(initialConn);
            }
            
            document.getElementById('btn-send').addEventListener('click', sendMessage);
            document.getElementById('chat-input').addEventListener('keypress', (e) => {
                if(e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
        }

        async function loadConversations() {
            try {
                const res = await fetch('/api/conversations', { headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` } });
                const data = await res.json();
                if(res.ok) {
                    conversations = data.conversations || [];
                    renderConversations();
                }
            } catch(e) { console.error(e); }
        }

        function renderConversations() {
            const list = document.getElementById('conv-list');
            if(!conversations.length) {
                list.innerHTML = `<div style="padding: 24px; color: var(--muted); text-align: center;">No active connections.</div>`;
                return;
            }
            
            list.innerHTML = conversations.map(c => {
                const u = c.otherUser;
                const initial = u.name ? u.name.charAt(0) : '?';
                let lastMsg = 'No messages yet';
                let timeStr = '';
                if(c.last_message) {
                    lastMsg = c.last_message.message;
                    timeStr = new Date(c.last_message.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                }
                const isActive = activeConnId === c.id;
                const unreadBadge = c.unread_count > 0 ? `<div class="unread-badge">${c.unread_count}</div>` : '';
                const previewClass = c.unread_count > 0 ? 'conv-preview unread' : 'conv-preview';
                
                return `
                <div class="conv-item ${isActive ? 'active' : ''}" onclick="openChat('${c.id}')">
                    <div class="conv-avatar">${initial}</div>
                    <div class="conv-details">
                        <div class="conv-header">
                            <span class="conv-name">${u.name}</span>
                            <span class="conv-time">${timeStr}</span>
                        </div>
                        <div class="${previewClass}">${escapeHtml(lastMsg)}</div>
                    </div>
                    ${unreadBadge}
                </div>
                `;
            }).join('');
        }
        
        async function openChat(connId) {
            activeConnId = connId;
            const conn = conversations.find(c => c.id === connId);
            if(!conn) return; // Might happen if forced URL param is invalid
            
            renderConversations(); // highlight active
            
            document.getElementById('conv-sidebar').classList.add('hidden');
            document.getElementById('chat-area').classList.add('active');
            
            document.getElementById('chat-empty').style.display = 'none';
            document.getElementById('active-chat').style.display = 'flex';
            
            const u = conn.otherUser;
            document.getElementById('chat-header-avatar').innerText = u.name ? u.name.charAt(0) : '?';
            document.getElementById('chat-header-name').innerText = u.name;
            
            const pane = document.getElementById('messages-pane');
            pane.innerHTML = '<div style="color:var(--muted);text-align:center;margin-top:20px;">Loading...</div>';
            
            // Mark read optimistically
            conn.unread_count = 0; 
            renderConversations();
            
            try {
                const res = await fetch(`/api/conversations/${connId}/messages`, { headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` } });
                const data = await res.json();
                if(res.ok) {
                    pane.innerHTML = data.messages.map(m => renderMessage(m)).join('');
                    scrollToBottom();
                    
                    // Trigger mark-read on server
                    await fetch(`/api/conversations/${connId}/read`, { method: 'POST', headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` } });
                    socket.emit('mark-read', connId);
                }
            } catch(e) { console.error(e); }
        }

        function closeChat() {
            activeConnId = null;
            document.getElementById('conv-sidebar').classList.remove('hidden');
            document.getElementById('chat-area').classList.remove('active');
            document.getElementById('chat-empty').style.display = 'flex';
            document.getElementById('active-chat').style.display = 'none';
            renderConversations();
        }

        function renderMessage(msg) {
            const isMe = msg.sender_id === currentUser.id;
            const time = new Date(msg.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            // We can show read state if sent by me and read_at is not null
            let readMark = '';
            if (isMe && msg.read_at) {
                readMark = ' ✓✓'; // simple indicator
            }
            
            return `
            <div class="message ${isMe ? 'sent' : 'received'}" id="msg-${msg.id}">
                <div class="msg-bubble">${msg.message}</div>
                <div class="msg-meta">${time}${readMark}</div>
            </div>
            `;
        }

        function sendMessage() {
            if(!activeConnId) return;
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if(!text) return;
            
            const clientMessageId = 'client_' + Date.now() + '_' + Math.random().toString(36).substring(2,9);
            
            socket.emit('direct-message', { connectionId: activeConnId, message: text, clientMessageId: clientMessageId });
            
            // Optimistic render
            const msgObj = {
                id: clientMessageId, // sets DOM id to msg-client_...
                clientMessageId: clientMessageId,
                sender_id: currentUser.id,
                message: escapeHtml(text),
                created_at: new Date().toISOString(),
                read_at: null
            };
            document.getElementById('messages-pane').insertAdjacentHTML('beforeend', renderMessage(msgObj));
            scrollToBottom();
            
            input.value = '';
            
            // Update conv list
            const conn = conversations.find(c => c.id === activeConnId);
            if (conn) {
                conn.last_message = msgObj;
                conn.updated_at = new Date().toISOString();
                conversations.sort((a,b) => new Date(b.updated_at) - new Date(a.updated_at));
                renderConversations();
            }
        }

        function handleNewMessage(msg) {
            const connId = msg.connection_id;
            const conn = conversations.find(c => c.id === connId);
            if (conn) {
                conn.last_message = msg;
                conn.updated_at = msg.created_at;
                if (activeConnId !== connId) {
                    conn.unread_count = (conn.unread_count || 0) + 1;
                }
                conversations.sort((a,b) => new Date(b.updated_at) - new Date(a.updated_at));
                renderConversations();
            } else {
                // If it's a new conversation not loaded, reload list
                loadConversations();
            }
            
            if (activeConnId === connId) {
                let existingEl = null;
                if (msg.clientMessageId) {
                    existingEl = document.getElementById('msg-' + msg.clientMessageId);
                }
                
                if (existingEl) {
                    // Replace the optimistic DOM element with the real one
                    existingEl.outerHTML = renderMessage(msg);
                } else {
                    // Append to chat pane
                    document.getElementById('messages-pane').insertAdjacentHTML('beforeend', renderMessage(msg));
                    scrollToBottom();
                }
                
                // Mark read immediately
                fetch(`/api/conversations/${connId}/read`, { method: 'POST', headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` } });
                socket.emit('mark-read', connId);
            }
        }
        
        async function refreshMessages(connId) {
    try {
        const res = await fetch('/api/conversations/' + connId + '/messages', { headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') } });
        const data = await res.json();
        if(res.ok) {
            document.getElementById('messages-pane').innerHTML = data.messages.map(m => renderMessage(m)).join('');
            scrollToBottom();
        }
    } catch(e) { console.error(e); }
}

function handleMessageRead(data) {
            if (activeConnId === data.connectionId) {
                // Reload messages to update UI with read ticks, or just update the DOM if we kept track
                // For simplicity, re-fetch messages
                refreshMessages(activeConnId);
            }
        }

        function scrollToBottom() {
            const pane = document.getElementById('messages-pane');
            pane.scrollTop = pane.scrollHeight;
        }

        function escapeHtml(value) {
            if(!value) return '';
            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        init();
    </script>
</body>
