<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HIVE - Session Review</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<style>
    body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
    }
    .review-container {
        background: #0d1120;
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 40px;
        width: 100%;
        max-width: 500px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        position: relative;
        z-index: 10;
    }
    .star-rating {
        display: flex;
        flex-direction: row-reverse;
        justify-content: center;
        gap: 8px;
        margin: 24px 0;
    }
    .star-rating input {
        display: none;
    }
    .star-rating label {
        font-size: 40px;
        color: rgba(255,255,255,0.1);
        cursor: pointer;
        transition: color 0.2s;
    }
    .star-rating label:hover,
    .star-rating label:hover ~ label,
    .star-rating input:checked ~ label {
        color: #f59e0b;
    }
    .form-group {
        margin-bottom: 24px;
    }
    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-size: 13px;
        color: var(--muted);
    }
    .form-group textarea {
        width: 100%;
        background: rgba(255,255,255,0.05);
        border: 1px solid var(--border);
        padding: 12px;
        border-radius: 8px;
        color: #fff;
        resize: vertical;
        min-height: 100px;
    }
</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-glow bg-glow-blue"></div>
<div class="bg-glow bg-glow-purple"></div>

<div class="review-container">
    <div style="text-align: center; margin-bottom: 24px;">
        <h1 style="font-size: 24px; margin-bottom: 8px;">Session Completed</h1>
        <p style="color: var(--muted);">How was your experience?</p>
    </div>
    
    <div id="error-msg" style="color: #ef4444; margin-bottom: 16px; text-align: center;"></div>

    <form id="review-form">
        <div class="star-rating">
            <input type="radio" id="star5" name="rating" value="5"><label for="star5">★</label>
            <input type="radio" id="star4" name="rating" value="4"><label for="star4">★</label>
            <input type="radio" id="star3" name="rating" value="3"><label for="star3">★</label>
            <input type="radio" id="star2" name="rating" value="2"><label for="star2">★</label>
            <input type="radio" id="star1" name="rating" value="1"><label for="star1">★</label>
        </div>

        <div class="form-group">
            <label>Leave a comment (optional)</label>
            <textarea id="comment" placeholder="What did you learn? How was the communication?"></textarea>
        </div>

        <button type="submit" class="btn-primary btn-full">Submit Review</button>
        <button type="button" class="btn-primary btn-full" style="background: transparent; border: 1px solid var(--border); margin-top: 12px;" onclick="window.location.href='dashboard.html'">Skip</button>
    </form>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session');
        if (!sessionId) {
            window.location.href = 'dashboard.html';
        }

        document.getElementById('review-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const rating = document.querySelector('input[name="rating"]:checked')?.value;
            const comment = document.getElementById('comment').value;

            if (!rating) {
                document.getElementById('error-msg').innerText = 'Please select a star rating.';
                return;
            }

            const token = localStorage.getItem('token');
            try {
                const res = await fetch('/api/reviews', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        session_id: sessionId,
                        overall_rating: parseInt(rating),
                        comment: comment
                    })
                });

                const data = await res.json();
                if (!res.ok) {
                    document.getElementById('error-msg').innerText = data.error || 'Failed to submit review.';
                    if (data.error === 'Cannot review an incomplete session' || data.error === 'You have already reviewed this user for this session') {
                        setTimeout(() => { window.location.href = 'dashboard.html'; }, 2000);
                    }
                    return;
                }

                window.location.href = 'dashboard.html';
            } catch (err) {
                document.getElementById('error-msg').innerText = 'Network error.';
            }
        });
    });
</script>
</body>
</html>
